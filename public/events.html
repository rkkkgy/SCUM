<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SCUM 历史事件</title>
<style>
:root{
  color-scheme:dark;
  --bg:#0d1016; --panel:#141822; --line:#232a38; --text:#e7eaf0;
  --muted:#8c95a8; --green:#4ade80; --amber:#fbbf24; --red:#f87171; --blue:#60a5fa;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 "Microsoft YaHei",system-ui,-apple-system,sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:26px 22px 60px}
header{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
h1{font-size:21px;margin:0 0 6px;letter-spacing:.3px}
h1 .dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--amber);margin-right:8px;vertical-align:middle;box-shadow:0 0 0 4px rgba(251,191,36,.14)}
.meta{color:var(--muted);font-size:12.5px}
.meta b{color:#c7cedd;font-weight:600}
a.btn,button{background:#1d2330;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:7px 14px;font-size:13px;cursor:pointer;text-decoration:none;display:inline-block;transition:.15s}
a.btn:hover,button:hover{background:#252d3d;border-color:#33405a}
button.primary{background:#1d4ed8;border-color:#2563eb}
button.primary:hover{background:#2563eb}
button:disabled{opacity:.45;cursor:not-allowed}
.controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:14px}
.controls .sep{width:1px;height:22px;background:var(--line);margin:0 2px}
label{color:var(--muted);font-size:13px}
input[type=date],input[type=search]{background:#0f131b;border:1px solid var(--line);color:var(--text);border-radius:8px;padding:6px 8px;font-size:13px}
input[type=search]{width:260px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--panel);margin-bottom:14px}
.tab{font-size:12px;padding:3px 10px;border-radius:999px;background:#171d29;color:#93a0b8;cursor:pointer;border:1px solid #222a3a;user-select:none;transition:.15s}
.tab:hover{background:#1e2735}
.tab.active{background:#1d4ed8;border-color:#2563eb;color:#fff}
.tab .n{opacity:.65;margin-left:4px;font-variant-numeric:tabular-nums}
.summary{color:var(--muted);font-size:12.5px;margin:0 2px 10px}
.summary b{color:#c7cedd;font-weight:600}
.list{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.ev{display:flex;gap:10px;padding:10px 14px;border-bottom:1px solid #1a2029;font-size:12.5px;align-items:flex-start;border-left:3px solid var(--tone,#94a3b8)}
.ev:last-child{border-bottom:none}
.ev time{color:#657089;font-variant-numeric:tabular-nums;flex:none;font-size:11.5px;margin-top:2px;min-width:64px}
.cat{font-size:11px;padding:1px 8px;border-radius:999px;white-space:nowrap;flex:none;margin-top:1px;background:rgba(148,163,184,.12);color:#9aa6bd}
.cat-online{background:rgba(74,222,128,.12);color:#86efac}
.cat-kill{background:rgba(248,113,113,.12);color:#fca5a5}
.cat-unlock{background:rgba(251,191,36,.12);color:#fcd34d}
.cat-rank{background:rgba(96,165,250,.12);color:#93c5fd}
.cat-risk{background:rgba(248,113,113,.18);color:#fca5a5}
.cat-system{background:rgba(148,163,184,.16);color:#cbd5e1}
.ev .body{flex:1;min-width:0}
.ev .t1{color:#dfe5f1;word-break:break-all}
.ev .t2{color:#8c95a8;font-size:11.5px;margin-top:2px;word-break:break-all}
.ev details{margin-top:4px}
.ev summary{cursor:pointer;color:#6f7a90;font-size:11.5px}
pre{margin:6px 0 0;padding:10px;background:#0f131b;border:1px solid #1e2634;border-radius:8px;color:#aeb7c8;font-size:11.5px;line-height:1.5;overflow:auto;max-height:340px;white-space:pre-wrap;word-break:break-all}
.empty{padding:26px 16px;color:var(--muted);font-size:13px;text-align:center}
.more{display:flex;justify-content:center;margin-top:14px}
.hint{color:#6f7a90;font-size:11.5px}
@media(max-width:700px){input[type=search]{width:100%}.ev time{min-width:0}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1><span class="dot"></span>历史事件</h1>
      <div class="meta">
        数据源 <b>1199.scum8.com</b> · 完整事件流水 · 按事件时间倒序 ·
        <span id="range">—</span>
      </div>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <a class="btn" href="/">← 返回看板</a>
      <a class="btn" href="/data">原始数据</a>
      <a class="btn" id="csv" href="#">导出 CSV</a>
    </div>
  </header>

  <div class="controls">
    <label for="date">日期</label>
    <input type="date" id="date">
    <button class="primary" id="refresh">刷新</button>
    <label><input type="checkbox" id="auto" checked> 自动刷新（15 秒）</label>
    <div class="sep"></div>
    <input type="search" id="q" placeholder="搜索玩家 / 标题 / 说明">
    <span class="hint" id="hint">保留 14 天</span>
  </div>

  <div class="tabs" id="tabs"></div>
  <div class="summary" id="summary">加载中…</div>
  <div class="list" id="list"><div class="empty">加载中…</div></div>
  <div class="more"><button id="more" style="display:none">加载更多</button></div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const CATS = [
  { id: 'all', label: '全部' },
  { id: 'online', label: '在线' },
  { id: 'kill', label: '击杀' },
  { id: 'unlock', label: '开锁' },
  { id: 'rank', label: '榜单' },
  { id: 'risk', label: '风控' },
  { id: 'system', label: '系统' },
];
const LABEL = { online: '在线', kill: '击杀', unlock: '开锁', rank: '榜单', risk: '风控', system: '系统' };

let date = new URLSearchParams(location.search).get('date') || '';
let category = new URLSearchParams(location.search).get('category') || 'all';
let q = '';
let offset = 0;
const LIMIT = 100;
let total = 0;
let loaded = 0;
let counts = {};
let loading = false;
let timer = null;

const esc = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const todayKey = () => {
  const d = new Date();
  const p = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
};
const timeOf = (at) => {
  if (!at) return '—';
  const s = String(at);
  return s.slice(0, 10) === todayKey() ? s.slice(11, 19) : s.slice(5, 19);
};
const catOf = (e) => e.category || 'online';

function renderTabs() {
  const all = Object.values(counts).reduce((a, b) => a + b, 0);
  const parts = CATS.map((c) => {
    const n = c.id === 'all' ? all : (counts[c.id] || 0);
    return `<span class="tab ${category === c.id ? 'active' : ''}" data-cat="${c.id}">${c.label}<span class="n">${n}</span></span>`;
  });
  $('tabs').innerHTML = parts.join('');
  $('tabs').querySelectorAll('.tab').forEach((el) => {
    el.onclick = () => {
      if (category === el.dataset.cat) return;
      category = el.dataset.cat;
      offset = 0;
      loaded = 0;
      renderTabs();
      load(true);
    };
  });
}

function updateSummary() {
  $('summary').innerHTML = `共 <b>${total}</b> 条 · 已显示 <b>${loaded}</b>${q ? ' · 搜索：' + esc(q) : ''}`;
  $('more').style.display = offset + loaded < total ? 'inline-block' : 'none';
  $('csv').href = `/api/export/events.csv?date=${encodeURIComponent(date)}${category !== 'all' ? `&category=${category}` : ''}${q ? `&q=${encodeURIComponent(q)}` : ''}`;
  $('range').innerHTML = date ? `日期 <b>${esc(date)}</b>` : '—';
}

function renderEvent(e) {
  const cat = catOf(e);
  return `<div class="ev cat-${esc(cat)}">
    <time>${esc(timeOf(e.at))}</time>
    <span class="cat cat-${esc(cat)}">${esc(LABEL[cat] || cat)}</span>
    <div class="body">
      <div class="t1">${esc(e.title || e.nickname || '')}</div>
      ${e.detail ? `<div class="t2">${esc(e.detail)}</div>` : ''}
      <details><summary>原始 JSON</summary><pre>${esc(JSON.stringify(e, null, 2))}</pre></details>
    </div>
  </div>`;
}

async function fetchJson(url) {
  const r = await fetch(url, { cache: 'no-store' });
  if (!r.ok) {
    const text = await r.text().catch(() => '');
    throw new Error(`HTTP ${r.status} ${text.slice(0, 100)}`);
  }
  return r.json();
}

async function load(reset) {
  if (loading) return;
  loading = true;
  if (reset) { offset = 0; loaded = 0; }
  try {
    const params = new URLSearchParams({ limit: String(LIMIT), offset: String(offset) });
    if (date) params.set('date', date);
    if (category !== 'all') params.set('category', category);
    if (q) params.set('q', q);
    const j = await fetchJson('/api/events?' + params);
    date = j.date;
    counts = j.counts || {};
    total = j.total || 0;
    const items = j.items || [];
    $('date').value = date;
    renderTabs();
    if (reset) $('list').innerHTML = '';
    if (!items.length) {
      if (reset) $('list').innerHTML = '<div class="empty">这个日期 / 分类下还没有事件</div>';
    } else {
      $('list').insertAdjacentHTML('beforeend', items.map(renderEvent).join(''));
      loaded += items.length;
      offset += items.length;
    }
    updateSummary();
  } catch (e) {
    $('list').innerHTML = `<div class="empty">加载失败：${esc(e.message)}</div>`;
    $('summary').textContent = '加载失败';
  } finally {
    loading = false;
  }
}

async function refresh() {
  await load(true);
}

$('refresh').onclick = refresh;
$('date').onchange = () => {
  date = $('date').value;
  offset = 0; loaded = 0;
  history.replaceState(null, '', `?date=${encodeURIComponent(date)}&category=${category}`);
  refresh();
};
$('more').onclick = () => load(false);

let qTimer = null;
$('q').oninput = () => {
  clearTimeout(qTimer);
  qTimer = setTimeout(() => {
    q = $('q').value.trim();
    offset = 0; loaded = 0;
    load(true);
  }, 300);
};

function autoLoop() {
  clearInterval(timer);
  timer = setInterval(() => {
    if (!$('auto').checked) return;
    if (document.visibilityState !== 'visible') return;
    if (loading || q || !date || date !== todayKey()) return;
    if (offset > LIMIT || document.querySelector('.ev details[open]')) return;
    refresh();
  }, 15000);
}

autoLoop();
load(true);
</script>
</body>
</html>
